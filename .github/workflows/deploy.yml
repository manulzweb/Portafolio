name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite desplegar manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela uno en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (puerta de calidad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  deploy:
    name: Publicar en Pages
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Configura Pages para usar Actions como fuente de despliegue
      - uses: actions/configure-pages@v5

      # El sitio es estático puro: se publica el repo tal cual, sin build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
